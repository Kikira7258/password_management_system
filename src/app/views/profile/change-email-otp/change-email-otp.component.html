<!-- Change Password Modal -->
<dialog class="modal" [open]="open">
    <div class="modal-box">
        <h3 class="modal-title">Change Email OTP</h3>
        <!-- Form for changing password -->
        <form  #otpForm="ngForm" (ngSubmit)="submitEmailOtp($event)">
            <!-- Confirm Password Input -->
            <div class="form-Group">
                <label for="email-otp">OTP</label>
                <input type="text" name="email-otp" id="email-otp" [(ngModel)]="otp" required minlength="6" maxlength="6" #emailOtpInput="ngModel" />

                <div class="text-red text-xs" *ngIf="emailOtpInput.control?.invalid && (otpForm.submitted || emailOtpInput.control?.dirty || emailOtpInput.control?.touched)">
                    <div *ngIf="emailOtpInput.control?.errors?.['required']">Password is required.</div>
                    <div *ngIf="emailOtpInput.control?.errors?.['minlength']">Password must be at least 6 characters long.</div>
                    <div *ngIf="emailOtpInput.control?.errors?.['maxlength']">Password cannot be more than 50 characters long.</div>
                </div>
            </div>

            <!-- Error Message -->
            <div class="text-red text-xs">
                change email OTP error message
            </div>
            
            <!-- Modal Actions -->
            <div class="modal-action">
                <!-- Submit button for changing password -->
                <button class="btn bg-cyan" type="submit">Change Password</button>
                <!-- Cancel button to close the modal -->
                <button class="btn bg-red" type="button" (click)="closeModal()">Cancel</button>
            </div>
        </form>

    </div>
</dialog>
